name: AI Delivery Gate

on:
  pull_request:
  push:
    branches:
      - ai-delivery-gate-pilot

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Validate Wrangler configuration
        run: npx wrangler deploy --dry-run
